# MariaDB datasource configuration for room-service
# Update `username` and `password` to match your MariaDB instance
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/vista-hotel-room-service
    username: root
    password: 123456789
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

# Optional: enable H2 console when running tests or dev in-memory DBs
#spring:
