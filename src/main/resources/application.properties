
# Basic application and discovery settings (keep these here; datasource & JPA
# configuration are defined in application.yml to target MariaDB)
spring.application.name=room-service
server.port=${SERVER_PORT:8082}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.jackson.mapper.accept-case-insensitive-enums=true

# Disable Spring Cloud compatibility verifier when intentionally using
# Spring Boot and Spring Cloud versions that the verifier flags as
# incompatible. Set to true to re-enable the check.
spring.cloud.compatibility-verifier.enabled=false

