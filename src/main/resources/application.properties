spring.application.name=room-service

server.port=${SERVER_PORT:8084}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:mariadb://localhost:3306/vista-hotel-room-service
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jackson.mapper.accept-case-insensitive-enums=true

spring.cloud.compatibility-verifier.enabled=false

# SECURITY (JWT)
app.jwt.secret=${APP_JWT_SECRET:my-ultra-secret-key-that-is-very-long-and-secure-for-jwt-signing-purpose-2024}

# Kafka Configuration
# - If you run the app on host: keep default localhost:9092
# - If you run the app in Docker network: set KAFKA_BOOTSTRAP_SERVERS=kafka:29092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

